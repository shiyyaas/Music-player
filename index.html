<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Music Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
    /* Custom range input styling */
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 12px;
      width: 12px;
      border-radius: 50%;
      background: #1C0B0A;
      cursor: pointer;
      margin-top: -4px; /* You need to specify a margin in Chrome, but in Firefox and IE it is automatic */
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: #e0d9cf;
      border-radius: 2px;
    }
  </style>
</head>
<body class="bg-[#d2d6c6] flex items-center justify-center min-h-screen">

  <!-- App Container -->
  <div class="w-full max-w-[375px] min-h-screen bg-[#f4efe8] relative flex flex-col shadow-2xl sm:min-h-[812px] sm:h-[812px] sm:rounded-[48px] sm:overflow-hidden sm:my-8">

    <!-- App Content -->
    <div class="flex-1 flex flex-col pt-8 pb-6">

      <!-- Top Nav -->
      <div class="flex justify-between items-center px-6 mb-6">
        <button class="text-black">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 12H5M5 12L12 19M5 12L12 5"/></svg>
        </button>
        <span class="text-sm font-medium tracking-wide">NOW PLAYING</span>
        <button class="text-black">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
      </div>

      <!-- Album Art -->
      <div class="w-full aspect-square bg-[#e8dfd5] flex-shrink-0 relative">
        <img id="album-art" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=500&auto=format&fit=crop" class="w-full h-full object-cover" alt="Album Art">
      </div>

      <!-- Track Info & Controls Container -->
      <div class="flex-1 flex flex-col px-6 pt-6">

        <!-- Track Title -->
        <div class="mb-6">
          <h2 id="track-name" class="text-[28px] leading-tight font-normal uppercase tracking-tight mb-1 text-[#1C0B0A]">SUNNY TULIPS</h2>
          <p id="artist-name" class="text-sm text-[#5a504a]">The Florals</p>
        </div>

        <!-- Progress Bar -->
        <div class="mb-6">
          <input type="range" id="progress-bar" value="0" min="0" max="100" class="w-full">
          <div class="flex justify-between text-xs text-[#8c827a] mt-2 font-medium">
            <span id="current-time">0:00</span>
            <span id="total-time">0:00</span>
          </div>
        </div>

        <!-- Main Controls -->
        <div class="flex items-center justify-between mb-8">
          <button id="prev-btn" class="w-12 h-12 flex items-center justify-center text-[#1C0B0A] hover:opacity-70 transition-opacity">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M19 20L9 12l10-8v16zM5 19h2V5H5v14z"/></svg>
          </button>

          <!-- Sharp Rectangular Action Button -->
          <button id="play-btn" class="flex-1 mx-4 h-14 bg-[#1C0B0A] text-[#f4efe8] text-sm font-medium tracking-widest flex items-center justify-center transition-opacity hover:bg-black">
            PLAY
          </button>

          <button id="next-btn" class="w-12 h-12 flex items-center justify-center text-[#1C0B0A] hover:opacity-70 transition-opacity">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l10 8-10 8V4zm14 1v14h-2V5h2z"/></svg>
          </button>
        </div>

        <!-- Volume Control -->
        <div class="flex items-center space-x-3 mt-auto mb-2 text-[#1C0B0A]">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <input type="range" id="volume-bar" value="100" min="0" max="100" class="flex-1">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5zM19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </div>

      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
